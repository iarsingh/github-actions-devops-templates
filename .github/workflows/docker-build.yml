name: Reusable Docker Build

# Reusable Docker build & push workflow using Buildx with the GitHub Actions cache backend.
# Outputs the built image tag and digest so downstream jobs (scan, deploy) can consume them.

on:
  workflow_call:
    inputs:
      image-name:
        description: 'Fully-qualified image name without tag, e.g. ghcr.io/org/app or REGION-docker.pkg.dev/PROJECT/REPO/app.'
        type: string
        required: true
      context:
        description: 'Docker build context path.'
        type: string
        required: false
        default: '.'
      dockerfile:
        description: 'Path to the Dockerfile relative to the build context root.'
        type: string
        required: false
        default: 'Dockerfile'
      platforms:
        description: 'Comma-separated target platforms, e.g. "linux/amd64" or "linux/amd64,linux/arm64".'
        type: string
        required: false
        default: 'linux/amd64'
      push:
        description: 'Whether to push the built image to the registry. When false the image is built and loaded locally only.'
        type: boolean
        required: false
        default: true
      registry:
        description: 'Registry hostname to log in to (e.g. ghcr.io). Leave empty to skip registry login.'
        type: string
        required: false
        default: 'ghcr.io'
      build-args:
        description: 'Newline-separated list of build args, e.g. "KEY1=value1\nKEY2=value2".'
        type: string
        required: false
        default: ''
      runs-on:
        description: 'Runner label(s) to execute on.'
        type: string
        required: false
        default: 'ubuntu-latest'
    secrets:
      registry-username:
        description: 'Registry username. Defaults to github.actor when omitted (for GHCR + GITHUB_TOKEN).'
        required: false
      registry-password:
        description: 'Registry password/token. When omitted the workflow uses the automatic GITHUB_TOKEN (works for ghcr.io).'
        required: false
    outputs:
      image-tag:
        description: 'The primary image reference that was built/pushed (image-name:sha).'
        value: ${{ jobs.docker-build.outputs.image-tag }}
      image-digest:
        description: 'The content-addressable digest of the pushed image.'
        value: ${{ jobs.docker-build.outputs.image-digest }}

permissions:
  contents: read
  packages: write   # required to push to GitHub Container Registry

jobs:
  docker-build:
    name: Docker build & push
    runs-on: ${{ inputs.runs-on }}
    outputs:
      image-tag: ${{ steps.primary.outputs.primary-tag }}
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        if: ${{ contains(inputs.platforms, 'arm') }}
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        if: ${{ inputs.push && inputs.registry != '' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.registry-username || github.actor }}
          password: ${{ secrets.registry-password || secrets.GITHUB_TOKEN }}

      - name: Compute image tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ inputs.image-name }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Expose primary tag
        id: primary
        run: echo "primary-tag=${{ inputs.image-name }}:sha-${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          load: ${{ !inputs.push && !contains(inputs.platforms, ',') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ inputs.build-args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
